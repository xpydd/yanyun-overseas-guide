        - heading "Nameless Sword + Nameless Spear" [level=2] [ref=e48]
        - paragraph [ref=e49]: Balanced DPS for new players. Prioritize ATK, Crit Rate, and Precision. Use Nameless Heart, Yi Shui Song, and Wei Meng Song.
        - list [ref=e50]:
          - listitem [ref=e51]: Best for first week progression and story.
          - listitem [ref=e52]: Simple swap timing after dodge or break windows.
          - listitem [ref=e53]: Safe default when you do not know your final role yet.
      - article [ref=e54]:
        - heading "Strategic Sword + Heavenquaker Spear" [level=2] [ref=e55]
        - paragraph [ref=e56]: Burst DPS for players comfortable with setup windows. Prioritize Crit Rate, Crit DMG, and ATK.
        - list [ref=e57]:
          - listitem [ref=e58]: Strong dungeon and boss burst.
          - listitem [ref=e59]: Requires cleaner timing than starter sword routes.
          - listitem [ref=e60]: Good pick when team utility is already covered.
      - article [ref=e61]:
        - heading "Panacea Fan + Soulshade Umbrella" [level=2] [ref=e62]
        - paragraph [ref=e63]: Support and healer route. Prioritize Healing, HP, and DEF while maintaining safe ranged uptime.
        - list [ref=e64]:
          - listitem [ref=e65]: Useful for group content and hard progression.
          - listitem [ref=e66]: Offers shields, sustain, and recovery windows.
          - listitem [ref=e67]: Lower pressure for players learning encounters.
      - article [ref=e68]:
        - heading "Stormbreaker Spear + Thundercry Blade" [level=2] [ref=e69]
        - paragraph [ref=e70]: Tank route with high mitigation and stable boss control. Prioritize DEF, HP, and Block.
        - list [ref=e71]:
          - listitem [ref=e72]: Best for frontline players.
          - listitem [ref=e73]: Forgiving in repeated dungeon runs.
          - listitem [ref=e74]: Works well when paired with ranged support.
      - article [ref=e75]:
        - heading "Infernal Twinblades + Mortal Rope Dart" [level=2] [ref=e76]
        - paragraph [ref=e77]: Fast DPS and PvP pressure build. Prioritize ATK Speed, Crit, and ATK.
        - list [ref=e78]:
          - listitem [ref=e79]: High APM and high pursuit value.
          - listitem [ref=e80]: Excellent for skirmish players.
          - listitem [ref=e81]: Less forgiving when stamina is mismanaged.
      - article [ref=e82]:
        - heading "Shadow Rope + Thunder Blade" [level=2] [ref=e83]
        - paragraph [ref=e84]: Skirmisher route for spacing, mobility, and punish timing. Prioritize Crit, Mobility, and Penetration.
        - list [ref=e85]:
